services:
  mongo:
    image: mongo:7
    ports:
      - '27017:27017'
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 20

  rabbitmq:
    image: rabbitmq:3-management
    environment:
      RABBITMQ_DEFAULT_USER: telemetry
      RABBITMQ_DEFAULT_PASS: telemetry
    ports:
      - '5672:5672'
      - '15672:15672'
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 5s
      timeout: 5s
      retries: 20

  state:
    build:
      context: .
      dockerfile: apps/state/Dockerfile
    environment:
      PORT: '3000'
      MONGODB_URI: mongodb://mongo:27017/telemetry?directConnection=true
      MONGODB_DB: telemetry
    ports:
      - '3000:3000'
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  ingest:
    build:
      context: .
      dockerfile: apps/ingest/Dockerfile
    environment:
      PORT: '4000'
      RABBITMQ_URL: amqp://telemetry:telemetry@rabbitmq:5672
    ports:
      - '4000:4000'
    depends_on:
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - const net = require('net'); const socket = net.connect(4000, '127.0.0.1', () => { socket.end(); process.exit(0); }); socket.on('error', () => process.exit(1));
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  processor:
    build:
      context: .
      dockerfile: apps/processor/Dockerfile
    environment:
      MONGODB_URI: mongodb://mongo:27017/telemetry?directConnection=true
      MONGODB_DB: telemetry
      RABBITMQ_URL: amqp://telemetry:telemetry@rabbitmq:5672
    depends_on:
      mongo:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
