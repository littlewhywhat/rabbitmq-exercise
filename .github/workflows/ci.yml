name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - name: Run the compose stack
        run: |
          set -o pipefail
          bash scripts/e2e.sh 2>&1 | tee "$RUNNER_TEMP/e2e.log"
      - if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo 'e2e failed'
            echo
            echo '````'
            awk '/^stack is up$/,/^===== ps =====/' "$RUNNER_TEMP/e2e.log"
            echo '----- tail -----'
            tail -n 80 "$RUNNER_TEMP/e2e.log"
            echo '````'
          } > "$RUNNER_TEMP/e2e-comment.md"
          gh pr comment "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}" --body-file "$RUNNER_TEMP/e2e-comment.md"
